<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Feliz Día Mamá</title>

<style>

*{
  margin:0;
  padding:0;
  box-sizing:border-box;
  font-family:Arial, Helvetica, sans-serif;
}

body{
  overflow:hidden;
  background:black;
}

.slideshow{
  position:relative;
  width:100%;
  height:100vh;
}

.slide{
  position:absolute;
  width:100%;
  height:100%;
  opacity:0;
  animation:fade 18s infinite;
}

.slide img{
  width:100%;
  height:100%;
  object-fit:cover;
  filter:brightness(.55);
}

.slide:nth-child(1){
  animation-delay:0s;
}

.slide:nth-child(2){
  animation-delay:6s;
}

.slide:nth-child(3){
  animation-delay:12s;
}

@keyframes fade{

  0%{
    opacity:0;
    transform:scale(1);
  }

  10%{
    opacity:1;
  }

  30%{
    opacity:1;
    transform:scale(1.08);
  }

  40%{
    opacity:0;
  }

  100%{
    opacity:0;
  }
}

.overlay{
  position:absolute;
  inset:0;
  display:flex;
  justify-content:center;
  align-items:center;
  text-align:center;
  padding:20px;
  z-index:5;
}

.message{
  color:white;
  max-width:900px;
  animation:float 3s ease-in-out infinite;
}

.message h1{
  font-size:70px;
  margin-bottom:20px;
  text-shadow:0 0 20px rgba(255,255,255,.5);
}

.message p{
  font-size:28px;
  line-height:1.6;
}

@keyframes float{
  0%{transform:translateY(0px);}
  50%{transform:translateY(-10px);}
  100%{transform:translateY(0px);}
}

.heart{
  position:absolute;
  bottom:-50px;
  color:#ff4d6d;
  font-size:25px;
  animation:rise linear infinite;
}

@keyframes rise{

  0%{
    transform:translateY(0) scale(1);
    opacity:1;
  }

  100%{
    transform:translateY(-120vh) scale(1.8);
    opacity:0;
  }
}

.music-button{
  position:absolute;
  bottom:30px;
  right:30px;
  z-index:20;
}

.music-button button{
  padding:15px 25px;
  border:none;
  border-radius:12px;
  background:#ff4d6d;
  color:white;
  font-size:16px;
  cursor:pointer;
  font-weight:bold;
}

.music-button button:hover{
  transform:scale(1.05);
}

@media(max-width:768px){

  .message h1{
    font-size:45px;
  }

  .message p{
    font-size:20px;
  }
}

</style>
</head>

<body>

<div class="slideshow">

  <div class="slide">
    <img src="foto1.jpg" alt="">
  </div>

  <div class="slide">
    <img src="foto2.jpg" alt="">
  </div>

  <div class="slide">
    <img src="foto3.jpg" alt="">
  </div>

</div>

<div class="overlay">

  <div class="message">
    <h1>Feliz Día Mamá ❤️</h1>

    <p>
      Gracias por estar siempre conmigo,
      por tu amor, tus consejos y todo lo que haces cada día.
      Eres la persona más importante de mi vida.
    </p>
  </div>

</div>

<div class="music-button">
  <button onclick="document.getElementById('music').play()">
    ▶ Reproducir música
  </button>
</div>

<audio id="music" loop>
  <source src="musica.mp3" type="audio/mpeg">
</audio>

<script>

for(let i=0; i<35; i++){

  let heart=document.createElement("div");

  heart.classList.add("heart");

  heart.innerHTML="❤";

  heart.style.left=Math.random()*100+"vw";

  heart.style.animationDuration=
  (4 + Math.random()*6)+"s";

  heart.style.fontSize=
  (15 + Math.random()*30)+"px";

  document.body.appendChild(heart);
}

</script>

</body>
</html>
